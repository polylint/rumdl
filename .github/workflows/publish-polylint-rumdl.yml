# Publishes the polylint-rumdl crate (this fork's package) from the polylint-rumdl branch.
# Triggered by a `polylint-rumdl-vX.Y.Z` tag; the tag must point at the polylint-rumdl branch and match
# Cargo.toml. Authenticates with crates.io trusted publishing, so no API token is stored.
name: Publish polylint-rumdl

on:
  push:
    tags: ["polylint-rumdl-v*"]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'polylint/rumdl'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag matches Cargo.toml and the polylint-rumdl branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "polylint-rumdl") | .version')"
          if [ "${TAG#polylint-rumdl-v}" != "$version" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          git fetch --no-tags origin polylint-rumdl
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/polylint-rumdl; then
            echo "::error::${TAG} is not on the polylint-rumdl branch" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p polylint-rumdl
